flowcharts:
  availability:
    description: Three sampling methods with varying availability; needle-biopsy wait is a delay (option values
      do not depend on the other options)
    policy:
      pet_on_time:
        mix:
          pet_triage: 1.0
          pet_early_route: 0.0
        source: assumption
        note: share of on-time PET referrals made when the referral letter is triaged (before the first visit);
          calibrated
      method:
        rules:
        - when: location == 'central'
          choose: bronch1
        - when: location == 'peripheral'
          choose: ttnb1
        default: ebus1
        source: assumption
        note: 'hand-written: central -> bronchoscopy, peripheral -> needle biopsy, else EBUS'
    nodes:
    - id: ct
      test: baseline_ct
      label: CT scan
      when: group == 'lung_referral'
    - id: visit
      test: first_visit
      after:
      - ct
      label: First hospital visit
    - id: ct_redo
      test: ct_redo
      after:
      - visit
      when: ct_inadequate == 'yes'
      label: New CT (first one inadequate)
    - id: pet_on_time
      kind: choice
      after:
      - ct
      options:
      - pet_triage
      - pet_early_route
      label: PET-CT ordered at triage or at the first visit
    - id: pet_triage
      test: pet_ct
      label: PET-CT (ordered at referral triage)
    - id: pet_early_route
      after:
      - visit
      label: PET-CT ordered at first visit
    - id: pet_early
      test: pet_ct
      after:
      - pet_early_route
      after_optional:
      - ct_redo
      label: PET-CT
    - id: pet_scan
      after_any:
      - pet_triage
      - pet_early
      label: PET-CT result
    - id: workup
      test: further_workup
      after:
      - pet_scan
      when: further_workup_after_pet == 'yes'
      label: Further tests after PET-CT
    - id: pet
      after:
      - pet_scan
      after_optional:
      - workup
      label: PET-CT done
    - id: ex_test
      test: exercise_test
      after:
      - visit
      when: needs_exercise_test == 'yes'
      label: Exercise test
    - id: exercise
      after:
      - visit
      after_optional:
      - ex_test
      label: Exercise test done
    - id: mdt
      test: tumour_board
      after:
      - pet
      - exercise
      label: Tumour board
    - id: book_surgery
      test: surgery_booking
      after:
      - mdt
      when: treatment == 'surgery'
      label: Waiting for surgery
    - id: book_rt
      test: radiotherapy_booking
      after:
      - mdt
      when: treatment == 'radiotherapy'
      label: Waiting for radiotherapy
    - id: method
      kind: choice
      after:
      - mdt
      options:
      - bronch1
      - ebus1
      - ttnb1
      label: Choose sampling method
      availability:
        bronch1:
          p_available: 0.7
        ebus1:
          p_available: 0.6
        ttnb1:
          p_available: 0.6
    - id: bronch1
      test: bronchoscopy
      retry:
        max: 0
        'on': nondiagnostic
        fallback: ttnb_rescue
      label: Bronchoscopy (needle biopsy if non-diagnostic)
    - id: ebus1
      test: radial_ebus
      label: Radial EBUS
    - id: ttnb1
      test: ttnb
      label: Needle biopsy
    - id: ttnb_rescue
      test: ttnb
      after:
      - bronch1
      when: 'False'
      label: Needle biopsy after a non-diagnostic bronchoscopy (runs only as the fallback)
    - id: sampling_done
      after_optional:
      - method
      - bronch1
      - ebus1
      - ttnb1
      - ttnb_rescue
      label: Sampling finished
    - id: diagnosis
