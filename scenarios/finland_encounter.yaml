# Finnish primary care as an encounter loop (C8, decisions D44-D49), then the calibrated hospital part of
# scenarios/finland_lung.yaml (flowchart `baseline` from its referral node on). ALL DATA IS SYNTHETIC.
#
#   python -m pathway_sim run scenarios/finland_encounter.yaml --flowchart encounter --n 2000 --seed 1
#
# Patients are reference cards of catalogue/lung-primary-care (generated on the fly, cached under runs/),
# drawn to the catalogue's prevalence. Nurse and GP encounters reveal findings into the patient record
# (record/1) and choose actions with the decision tables in finland_encounter_policy.yaml, which read the
# record only (I1). How it works: docs/encounter_loop.md.
#
# PLACEHOLDERS (WP-C8-1, to be replaced by WP-C8-3): the care model in finland_encounter_care/ (used only
# while the catalogue has no care.yaml), the encounter resources below, natural_course, visit costs and
# the decision-table numbers. Paths are relative to this file.
format: encounter_world/1
id: finland_encounter
description: >
  Synthetic Finnish chest-symptom presenters in one large wellbeing services county. Primary care is an
  encounter loop (nurse and GP see the record only, tests repeat with fresh results, patients return
  while symptoms persist); a referral hands the patient to the hospital steps of finland_lung (baseline).
  Clock: first contact in primary care.
target_days: 90                      # as finland_lung (provisional display target, D20)
catalogue: ../catalogue/lung-primary-care
care: ../catalogue/lung-primary-care           # directory holding care.yaml (WP-C8-3)
care_fallback: finland_encounter_care          # PLACEHOLDER care.yaml used while the catalogue has none
policy: finland_encounter_policy.yaml
resources_file: finland_encounter_resources.yaml   # WP-C8-3; merged over `resources` below when present

library:                             # reference cards generated per primary condition (seeded, deterministic)
  per_condition: 60
  seed: 1
prevalence: catalogue                # the catalogue's base prevalence of each primary condition
arrivals: {rate_per_day: 44, source: assumption, note: "as finland_lung: a Pirkanmaa-sized stream of chest-symptom presenters"}

hospital:
  scenario: finland_lung.yaml
  flowchart: baseline
  entry: referral_in                 # the referral node; it and everything downstream of it are kept
  urgent_referral_priority: true     # refer_urgent fast-tracks the patient (reserved slots, urgent leads)
  # Hospital steps whose test maps to a catalogue test read the card (I3: same attempt numbering as
  # primary care); the others keep finland_lung's condition-dependent probabilities (known weakness).
  card_tests: {chest_ct: chest_ct, pet_ct: pet_ct}
  condition_map:                     # catalogue condition -> finland_lung condition (for the other steps)
    lung_cancer: lung_cancer_nonspec           # lung_cancer_site when the patient reports haemoptysis
    pneumonia: pneumonia
    copd_exacerbation: copd_exacerbation
    asthma: other_benign
    heart_failure: other_benign
    tuberculosis: other_benign
    benign_nodule: benign_nodule
    reflux_postinfectious_cough: other_benign
    no_disease_found: self_limiting
    viral_self_limiting: self_limiting
    worried_well: self_limiting
  default_condition: other_benign

resources:                           # PLACEHOLDERS; merged over finland_lung's resources
  gp_appt: {type: server, capacity_per_day: 160, weekdays_only: true, min_lead_days: 12, urgent_lead_days: 1, urgent_reserved_share: 0.15, source: assumption, note: "PLACEHOLDER: finland_lung has 74/day for one visit per patient; the loop has reviews and returns. Urgent: next day from reserved slots"}
  nurse_appt: {type: server, capacity_per_day: 60, weekdays_only: true, min_lead_days: 2, urgent_lead_days: 0, source: assumption, note: "PLACEHOLDER"}
  lab: {type: server, capacity_per_day: 200, weekdays_only: true, min_lead_days: 0, source: assumption, note: "PLACEHOLDER: health-centre laboratory, same or next day"}
  pathology: {type: server, capacity_per_day: 20, weekdays_only: true, min_lead_days: 1, source: assumption, note: "PLACEHOLDER"}
  mri: {type: server, capacity_per_day: 2, weekdays_only: true, min_lead_days: 7, source: assumption, note: "PLACEHOLDER"}

encounters:
  review_urgency: urgent             # a review after a result or a treatment is booked with the urgent lead (PLACEHOLDER)
  no_advice_return_factor: {value: 0.6, source: assumption, note: "PLACEHOLDER: a plain discharge (no 'come back if it persists') multiplies return_if_persisting by this"}
  cost_scale: {value: 1.0, source: assumption, note: "D46: multiplies every test cost (visible world setting)"}
  visit_cost_eur:                    # PLACEHOLDERS (WP-C8-3 to source from county price lists)
    nurse: {value: 30, source: assumption}
    gp: {value: 75, source: assumption}

# How illnesses end without treatment (hidden side). PLACEHOLDERS (care/1 has no field for it yet):
# p = chance it resolves by itself, days = when. `unexplained` covers symptoms no condition causes.
natural_course:
  viral_self_limiting: {p: 0.95, days: {dist: lognormal, median: 14, p90: 35}, source: assumption}
  pneumonia: {p: 0.4, days: {dist: lognormal, median: 21, p90: 45}, source: assumption}
  copd_exacerbation: {p: 0.5, days: {dist: lognormal, median: 21, p90: 45}, source: assumption}
  asthma: {p: 0.3, days: {dist: lognormal, median: 30, p90: 90}, source: assumption}
  reflux_postinfectious_cough: {p: 0.6, days: {dist: lognormal, median: 42, p90: 90}, source: assumption}
  heart_failure: {p: 0.0, days: {dist: fixed, value: 0}, source: assumption}
  benign_nodule: {p: 0.0, days: {dist: fixed, value: 0}, source: assumption, note: "a nodule does not go away; it rarely causes symptoms"}
  tuberculosis: {p: 0.0, days: {dist: fixed, value: 0}, source: assumption}
  unexplained: {p: 0.6, days: {dist: lognormal, median: 30, p90: 90}, source: assumption}
