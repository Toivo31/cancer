# PLACEHOLDER care model (care/1) for catalogue/lung-primary-care, used by scenarios/finland_encounter.yaml
# ONLY while catalogue/lung-primary-care/care.yaml does not exist (WP-C8-3 writes the real one; the world
# picks it up automatically). NOT medical content: every number is an assumption made by WP-C8-1 to let
# the engine run. Action ids follow catalogue/_examples/tiny/care.yaml so the example decision table works.
format: care/1
roles:
  - id: nurse
    label: Nurse
    resource: nurse_appt
    gathers:
      - {test: history, outputs: [cough, haemoptysis, dyspnoea, chest_pain, fever, weight_loss]}
    actions: [advice_return, book_gp_routine, book_gp_urgent]
  - id: gp
    label: GP
    resource: gp_appt
    gathers:
      - {test: history}
      - {test: examination}
    actions: [discharge, advice_return, follow_up, order_blood_count, order_crp, order_chest_xray, treat_antibiotics, treat_inhaler, refer_routine, refer_urgent]
actions:
  - {id: advice_return, kind: discharge, advice: true, label: "Self-care advice; come back if it persists"}
  - {id: discharge, kind: discharge, label: "No treatment, sent home"}
  - {id: book_gp_routine, kind: book, role: gp, urgency: routine, label: "Book a GP visit"}
  - {id: book_gp_urgent, kind: book, role: gp, urgency: urgent, label: "Book an urgent GP visit"}
  - {id: follow_up, kind: follow_up, days: {value: 14, source: assumption}, label: "Follow-up visit"}
  - {id: order_blood_count, kind: order, test: blood_count, label: "Blood count"}
  - {id: order_crp, kind: order, test: crp, label: "CRP"}
  - {id: order_chest_xray, kind: order, test: chest_xray, label: "Chest X-ray"}
  - {id: treat_antibiotics, kind: treat, treatment: antibiotics, review_days: {value: 14, source: assumption}, label: "Antibiotics"}
  - {id: treat_inhaler, kind: treat, treatment: inhaler, review_days: {value: 28, source: assumption}, label: "Inhaled bronchodilator / steroid"}
  - {id: refer_routine, kind: refer, urgency: routine, label: "Refer to a specialist"}
  - {id: refer_urgent, kind: refer, urgency: urgent, label: "Urgent referral"}
treatments:
  - id: antibiotics
    label: Antibiotics
    resolves:
      pneumonia: {p: {p: 0.9, source: assumption}, days: {dist: lognormal, median: 7, p90: 14, source: assumption}}
  - id: inhaler
    label: Inhaler
    resolves:
      copd_exacerbation: {p: {p: 0.7, source: assumption}, days: {dist: lognormal, median: 10, p90: 21, source: assumption}}
      asthma: {p: {p: 0.8, source: assumption}, days: {dist: lognormal, median: 10, p90: 21, source: assumption}}
behaviour:
  first_contact: {values: {nurse: 0.5, gp: 0.5}, source: KHALIFE2025}
  return_if_persisting: {p: 0.7, source: assumption, note: "after a discharge with advice, while any symptom persists"}
  return_delay_days: {dist: lognormal, median: 21, p90: 60, source: assumption}
  give_up_per_episode: {p: 0.05, source: assumption}
  horizon_days: {value: 365, source: assumption}
