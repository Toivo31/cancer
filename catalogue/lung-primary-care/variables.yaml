- id: hb_true
  label: "Haemoglobin (true value)"
  kind: lab_true
  type: continuous
  unit: "g/L"
  range: {min: 40, max: 220}
  given:
    lung_cancer:
      dist: empirical
      values: [98, 107, 112, 116, 119, 122, 125, 127, 130, 132, 134, 136, 139, 141, 144, 147, 150, 154, 159, 168]
      source: CHEN2021
      grade: C
      note: >-
        Stages I to III: 20 equally likely values at the quantiles of a normal distribution, mean 133
        and SD 18 g/L. This is our modelling choice: the research note says to shrink the anaemia
        share to about 0.15 to 0.20 below stage IV; here about 16% are below 115 g/L. Stage IV (by
        stage): quantiles of mean 123.3, SD 20.3 g/L, 32.1% anaemic (Hb below 120 men or 110 women),
        4,874 stage IV NSCLC patients at first visit, Zhejiang, China. The catalogue format has no
        normal distribution (see the report). Read through a summarising tool; re-check against the
        page.
      by:
        stage:
          IV:
            values: [84, 94, 100, 104, 108, 111, 114, 117, 119, 122, 125, 127, 130, 133, 135, 139, 142, 147, 153, 163]
            source: CHEN2021
            grade: C
            note: "Mean 123.3, SD 20.3 g/L; Chinese stage IV only."
    default:
      dist: uniform
      low: 120
      high: 165
      source: assumption
      grade: assumption
      note: >-
        Normal reference interval, as the research note suggests for non-cancer conditions (about 120
        to 165 g/L; the interval was not read on a page). Anaemia of chronic disease in COPD, heart
        failure or tuberculosis is not modelled.

- id: platelets_true
  label: "Platelet count (true value)"
  kind: lab_true
  type: continuous
  unit: "10^9/L"
  range: {min: 20, max: 1500}
  given:
    lung_cancer:
      dist: lognormal
      median: 340
      p90: 506
      source: assumption
      grade: assumption
      note: >-
        Chosen so that 30% are above 400 x10^9/L (research note section 9; HAMILTON2005: 26% of the
        132 tested cases, 34/132, versus 4.8% of controls). Median 340, p90 506 gives about 30% above
        400.
    default:
      dist: lognormal
      median: 260
      p90: 340
      source: assumption
      grade: assumption
      note: >-
        Chosen so that about 2% are above 400 x10^9/L (thrombocytosis threshold from BAILEY2017; 1.5
        to 2.2% in primary care consulters aged 40 and over). Median 260 is an assumed centre of the
        reference interval.

- id: crp_true
  label: "C-reactive protein (true value)"
  kind: lab_true
  type: continuous
  unit: "mg/L"
  range: {min: 0, max: 500}
  given:
    pneumonia:
      dist: lognormal
      median: 60
      p90: 200
      source: assumption
      grade: assumption
      note: >-
        Research note section 9: median about 60, p90 about 200 mg/L, anchored on MINNAARD2016 study
        medians (96 in a 43% pneumonia emergency study, IQR 20 to 258; 50 in a 20% general-practice
        study). No pneumonia-only distribution is published.
    lung_cancer:
      dist: lognormal
      median: 10
      p90: 70
      source: assumption
      grade: assumption
      note: >-
        No CRP distribution for lung cancer was found. As non-pneumonia with a heavier tail (research
        note section 9).
    tuberculosis:
      dist: lognormal
      median: 30
      p90: 100
      source: assumption
      grade: assumption
      note: "Group marker (D50): CRP is raised in TB, moderately; not sourced."
    copd_exacerbation:
      dist: lognormal
      median: 25
      p90: 90
      source: assumption
      grade: assumption
      note: "Group marker (D50): a bacterial or viral exacerbation raises CRP; not sourced."
    default:
      dist: lognormal
      median: 8
      p90: 40
      source: assumption
      grade: assumption
      note: >-
        Research note section 9: non-pneumonia primary care, anchored on MINNAARD2016 medians of 7 and
        14 mg/L at 5 to 13% pneumonia.

- id: calcium_true
  label: "Corrected calcium (true value)"
  kind: lab_true
  type: continuous
  unit: "mmol/L"
  range: {min: 1.5, max: 4.5}
  given:
    lung_cancer:
      dist: lognormal
      median: 2.4
      p90: 2.59
      source: CHAN2020
      grade: B
      note: >-
        Fitted by us so that the share above 2.62 mmol/L (hypercalcaemia) is 7.1%, as in 624
        tissue-proven lung cancers in Cork, Ireland (all stages and histologies); median 2.40 is
        assumed. By histology: squamous 12.2%, non-squamous NSCLC 4.3%, small cell 3.9%. Read through
        a summarising tool; re-check against the page.
      by:
        histology:
          squamous: {median: 2.4, p90: 2.64, source: CHAN2020, grade: B, note: "Fitted to 12.2% above 2.62."}
          adenocarcinoma:
            median: 2.4
            p90: 2.56
            source: CHAN2020
            grade: B
            note: "Fitted to 4.3% above 2.62 (non-squamous NSCLC)."
          small_cell: {median: 2.4, p90: 2.56, source: CHAN2020, grade: B, note: "Fitted to 3.9% above 2.62."}
    default:
      dist: lognormal
      median: 2.38
      p90: 2.5
      source: assumption
      grade: assumption
      note: >-
        Median 2.38 and p90 2.50 mmol/L give under 1% above 2.62; the reference interval was not read
        on a page.

- id: alp_true
  label: "Alkaline phosphatase (true value)"
  kind: lab_true
  type: continuous
  unit: "U/L"
  range: {min: 20, max: 1500}
  given:
    lung_cancer:
      dist: lognormal
      median: 106
      p90: 126
      source: YE2025
      grade: C
      note: >-
        NSCLC without bone metastasis (n=80): mean 106.2, SD 15.5 U/L; median taken as the mean and
        p90 as mean + 1.28 SD (our normal-to-lognormal approximation). Chinese hospital cohort, normal
        range there 45 to 125 U/L. The by-level uses the bone-metastasis group (n=68, mean 115.3, SD
        21.6) for any distant spread, which overstates ALP for non-bone spread. Read through a
        summarising tool; re-check against the page.
      by:
        distant_spread:
          "true":
            median: 115
            p90: 143
            source: YE2025
            grade: C
            note: "Mean 115.3, SD 21.6 U/L in NSCLC with bone metastasis."
    default:
      dist: uniform
      low: 45
      high: 125
      source: assumption
      grade: assumption
      note: >-
        Normal reference interval 45 to 125 U/L as stated in YE2025; uniform within it is our
        simplification.

- id: ldh_true
  label: "Lactate dehydrogenase (true value)"
  kind: lab_true
  type: continuous
  unit: "U/L"
  range: {min: 50, max: 3000}
  given:
    lung_cancer:
      dist: lognormal
      median: 200
      p90: 280
      source: assumption
      grade: assumption
      note: >-
        Stages I to III: slightly above the non-cancer values; no all-stage LDH distribution was found
        (research note). Stage IV by stage: LEE2016, 394 stage IV NSCLC in Korea, median 477 IU/L,
        56.9% above 450 IU/L; the p90 of 733 follows from that share (sigma 0.335) and ignores the
        long upper tail (range up to 2,850).
      by:
        stage:
          IV:
            median: 477
            p90: 733
            source: LEE2016
            grade: C
            note: "Median 477 IU/L; centre-specific cut-off 450. Re-check against the page."
    default:
      dist: lognormal
      median: 190
      p90: 240
      source: assumption
      grade: assumption
      note: >-
        Assumed centre 190 U/L with p90 240; the Finnish reference interval was not read on a page.

- id: lung_lesion
  label: "Lung lesion present (nodule, mass or shadow)"
  kind: imaging_true
  type: binary
  given:
    lung_cancer: {p: 1.0, source: assumption, grade: assumption, note: "A lung cancer is a lesion by definition."}
    benign_nodule: {p: 1.0, source: assumption, grade: assumption, note: "A benign nodule or scar is a lesion by definition."}
    tuberculosis:
      p: 0.5
      source: assumption
      grade: assumption
      note: "Nodular or cavitary lesions are common in pulmonary TB; not sourced."
    default:
      p: 0.01
      source: assumption
      grade: assumption
      note: >-
        Incidental small nodule alongside another condition. VANVUGT2012 had 'suspected nodules or
        shadows' in 1.8% of acute-cough presenters including cancers and the benign nodule class; the
        remainder is set here to 0.01.

- id: lesion_size_mm
  label: "Size of the largest lung lesion"
  kind: imaging_true
  type: size_mm
  only_if: lung_lesion
  range: {min: 1, max: 150}
  given:
    lung_cancer:
      dist: lognormal
      median: 30
      p90: 70
      source: assumption
      grade: assumption
      note: >-
        Research note section 9: lognormal, median 30 mm, p10 12 mm, p90 70 mm (consistent with
        surgical means of 37 to 46 mm, YANG2010, and smaller screening-detected cancers); no
        presenting-population size figure exists. Stage I is smaller by definition (stage I is a
        tumour of 4 cm or less): median 20, p90 35 is our assumption.
      by:
        stage:
          I:
            median: 20
            p90: 35
            source: assumption
            grade: assumption
            note: >-
              Stage I tumours are 4 cm or less by definition; values chosen so almost all are below 4
              cm.
    benign_nodule:
      dist: lognormal
      median: 8
      p90: 15
      source: assumption
      grade: assumption
      note: "Incidental nodules are mostly small; no size distribution was sourced."
    default:
      dist: lognormal
      median: 8
      p90: 15
      source: assumption
      grade: assumption
      note: "Incidental lesion in another condition: as for benign nodules."

- id: lesion_location
  label: "Location of the largest lung lesion"
  kind: imaging_true
  type: categorical
  values: [central, peripheral]
  only_if: lung_lesion
  given:
    lung_cancer:
      values: {central: 0.377, peripheral: 0.623}
      source: assumption
      grade: assumption
      note: >-
        By construction follows the cancer's location attribute (KOSIN2014 shares are on the
        condition); the base shares are only shown for reference.
      by:
        location:
          central:
            values: {central: 1.0, peripheral: 0.0}
            source: assumption
            grade: assumption
            note: "Follows the attribute."
          peripheral:
            values: {central: 0.0, peripheral: 1.0}
            source: assumption
            grade: assumption
            note: "Follows the attribute."
    default:
      values: {central: 0.1, peripheral: 0.9}
      source: assumption
      grade: assumption
      note: >-
        Benign and incidental lesions are mostly peripheral (scenario: 'most lung cancers and nodules
        are peripheral'); the split is our assumption.

- id: mediastinal_nodes
  label: "Enlarged or involved mediastinal lymph nodes"
  kind: imaging_true
  type: binary
  given:
    lung_cancer:
      p: 0.4
      source: assumption
      grade: assumption
      note: >-
        Research note section 9: about 0.40 of the whole presenting population (a rough bound from
        N0M0 shares by size, LEE2006 0.55-0.91, YANG2010 0.33-0.71; GELBERG2014 about 30% among those
        staged). By stage (our assumption, tuned so the mix gives about 0.40): stage I has no nodal
        spread by definition, stage II is hilar (N1), stage III is mediastinal (N2/N3) in most.
      by:
        stage:
          I: {p: 0.0, source: assumption, grade: assumption, note: "Stage I is node-negative by definition."}
          II:
            p: 0.05
            source: assumption
            grade: assumption
            note: "Stage II is N1 (hilar); mediastinal involvement is rare."
          III: {p: 0.9, source: assumption, grade: assumption, note: "Stage III is N2 or N3 disease in most."}
          IV: {p: 0.45, source: assumption, grade: assumption, note: "Chosen so that the overall share is about 0.40."}
    default:
      p: 0.02
      source: assumption
      grade: assumption
      note: "Reactive enlarged nodes (infection, sarcoid); placeholder."

- id: distant_spread
  label: "Distant metastases present"
  kind: imaging_true
  type: binary
  given:
    lung_cancer:
      p: 0.59
      source: assumption
      grade: assumption
      note: >-
        Stage IV is distant spread by definition (M1). Share equals the stage IV share of the
        condition; research note: 0.605 for IIIB, IV or not staged is an upper bound (PAAPPANEN2025).
      by:
        stage:
          I: {p: 0.0, source: assumption, grade: assumption, note: "Not stage IV."}
          II: {p: 0.0, source: assumption, grade: assumption, note: "Not stage IV."}
          III: {p: 0.0, source: assumption, grade: assumption, note: "Not stage IV."}
          IV: {p: 1.0, source: assumption, grade: assumption, note: "Definition of stage IV."}
    default: {p: 0.0, source: assumption, grade: assumption, note: "No cancer, no metastases."}

- id: consolidation
  label: "Consolidation on chest imaging (truth)"
  kind: imaging_true
  type: binary
  given:
    pneumonia:
      p: 0.95
      source: assumption
      grade: assumption
      note: >-
        GRACE defined pneumonia by the chest radiograph (VANVUGT2012), so nearly all have
        consolidation; clinical pneumonia without radiographic change exists.
    tuberculosis: {p: 0.5, source: assumption, grade: assumption, note: "Not sourced."}
    default: {p: 0.01, source: assumption, grade: assumption, note: "Background rate; not sourced."}

- id: brain_metastasis
  label: "Brain metastases present"
  kind: imaging_true
  type: binary
  given:
    lung_cancer:
      p: 0.052
      source: BROCKELSBY_PRENDECKI
      grade: B
      note: >-
        Asymptomatic brain metastases on pre-treatment imaging: stage III 10 of 193 (0.052). UK
        multicentre real-world cohort. Combined with later detection the study reports 6.0% (III). By
        stage below. Read through a summarising tool; re-check against the page.
      by:
        stage:
          I: {p: 0.01, source: assumption, grade: assumption, note: "No stage I figure on the pages read; set low."}
          II:
            p: 0.021
            source: BROCKELSBY_PRENDECKI
            grade: B
            note: "1 of 47 stage II, tiny numerator (6.2% combined with later detection)."
          IV:
            p: 0.15
            source: assumption
            grade: assumption
            note: "No stage IV figure on the pages read; set above stage III. The clinician should set it."
    default: {p: 0.0, source: assumption, grade: assumption, note: "No cancer, no brain metastases."}

- id: airflow_obstruction
  label: "Airflow obstruction on spirometry (FEV1/FVC below 0.70)"
  kind: function_true
  type: binary
  given:
    lung_cancer:
      p: 0.5
      source: YOUNG2009
      grade: B
      note: >-
        Spirometric COPD in about 50% of lung cancer patients against 8% of a matched community
        control group (odds ratio 11.6); 56-61% in a subgroup with spirometry before diagnosis.
        Authors and country not captured by the research lane. Read through a summarising tool;
        re-check against the page.
    copd_exacerbation:
      p: 0.9
      source: assumption
      grade: assumption
      note: "COPD is defined by obstruction; some are misdiagnosed. Not sourced."
    asthma: {p: 0.3, source: assumption, grade: assumption, note: "Variable obstruction in asthma; not sourced."}
    default:
      p: 0.08
      source: YOUNG2009
      grade: C
      note: >-
        The 8% of matched community controls with spirometric COPD (matched for age, sex and
        pack-years, so smokers); applied to non-cancer presenters, a different population. Read
        through a summarising tool; re-check against the page.

- id: fev1_pct_predicted
  label: "FEV1 as percent of predicted"
  kind: function_true
  type: continuous
  unit: "% predicted"
  range: {min: 10, max: 140}
  given:
    default:
      dist: empirical
      values: [77, 79, 81, 83, 85, 87, 89, 91, 93, 95, 97, 99, 101, 103, 105, 107, 109, 111, 113, 115]
      source: assumption
      grade: assumption
      note: >-
        Without obstruction: 20 equally likely values from 77 to 115 percent (normal range; not
        sourced). With obstruction (by below): GOLD stage shares of 6,283 UK general-practice COPD
        patients, I 17.1%, II 52.2%, III 25.5%, IV 5.2% (HAUGHNEY2014), as 40 equally likely values
        spread within the stage bands (I 80 or more, II 50-79, III 30-49, IV below 30); the bands are
        the standard GOLD definition, not read on a page, and the spread inside a band is ours.
      by:
        airflow_obstruction:
          "true":
            values:
              [22, 27, 31, 33, 35, 37, 39, 41, 43, 45, 47, 49, 50, 51, 53, 54, 56, 57, 59, 60, 62, 63, 64, 66, 67,
               69, 70, 72, 73, 75, 76, 78, 79, 80, 83, 86, 89, 92, 96, 100]
            source: HAUGHNEY2014
            grade: B
            note: >-
              Stage shares HAUGHNEY2014 (UK general practice, GOLD 2007); values within bands are an
              assumption. Re-check against the page.

- id: lesion_malignant
  label: "Malignant tissue present in the lesion"
  kind: tissue_true
  type: binary
  given:
    lung_cancer: {p: 1.0, source: assumption, grade: assumption, note: "A lung cancer is malignant by definition."}
    default:
      p: 0.0
      source: assumption
      grade: assumption
      note: >-
        No malignancy when the primary condition is not a cancer; an undetected second cancer is out
        of scope.

- id: histology_group
  label: "Histology group of the cancer"
  kind: tissue_true
  type: categorical
  values: [adenocarcinoma, squamous, small_cell, other]
  only_if: lesion_malignant
  given:
    lung_cancer:
      values: {adenocarcinoma: 0.402, squamous: 0.343, small_cell: 0.175, other: 0.08}
      source: assumption
      grade: assumption
      note: >-
        By construction follows the cancer's histology attribute (shares on the condition, FILHA2026
        and PAAPPANEN2025); base shares shown for reference.
      by:
        histology:
          adenocarcinoma:
            values: {adenocarcinoma: 1.0, squamous: 0.0, small_cell: 0.0, other: 0.0}
            source: assumption
            grade: assumption
            note: "Follows the attribute."
          squamous:
            values: {adenocarcinoma: 0.0, squamous: 1.0, small_cell: 0.0, other: 0.0}
            source: assumption
            grade: assumption
            note: "Follows the attribute."
          small_cell:
            values: {adenocarcinoma: 0.0, squamous: 0.0, small_cell: 1.0, other: 0.0}
            source: assumption
            grade: assumption
            note: "Follows the attribute."
          other:
            values: {adenocarcinoma: 0.0, squamous: 0.0, small_cell: 0.0, other: 1.0}
            source: assumption
            grade: assumption
            note: "Follows the attribute."
    default:
      values: {adenocarcinoma: 0.25, squamous: 0.25, small_cell: 0.25, other: 0.25}
      source: assumption
      grade: assumption
      note: "Never used: the variable exists only when the tissue is malignant."

# ---- Group marker (D50): one hidden variable several conditions cause, read by a cheap test (NT-proBNP).
- id: cardiac_strain
  label: "Raised natriuretic peptide (cardiac wall strain)"
  kind: lab_true
  type: binary
  given:
    heart_failure: {p: 0.95, source: assumption, grade: assumption, note: "High sensitivity is why the test is used to rule heart failure out; not sourced (MANT2009 abstract has no natriuretic peptide figure)."}
    copd_exacerbation: {p: 0.2, source: assumption, grade: assumption, note: "Right heart strain and age raise it in some; not sourced."}
    pneumonia: {p: 0.15, source: assumption, grade: assumption, note: "Raised in some older patients with acute infection; not sourced."}
    default: {p: 0.08, source: assumption, grade: assumption, note: "Raised with age and kidney disease in people without heart failure; not sourced."}

# ---- Definitive markers (D46): one binary hidden fact per condition, measured only by that condition's definitive test.

- id: dx_lung_cancer
  label: "Lung cancer is the truth (definitive-test marker)"
  kind: tissue_true
  type: binary
  given:
    lung_cancer: {p: 1, source: assumption, grade: assumption, note: "True exactly when the condition is active (D46); a definition, not a measurement."}
    default: {p: 0, source: assumption, grade: assumption, note: "False when the condition is not active."}

