# Hidden variables. `given` = distribution per primary condition; `default` covers the conditions not listed.
# Symptom and sign frequencies for lung cancer come from the CAPER GP records (ADES2014) and the Walter 2015 referral cohort; most
# look-alike frequencies are assumptions (the research note could not source them). Conditions without a number of their own fall
# back to `default`, which for symptoms is the rate in matched adults in GP records (a floor, not a presenter rate).
- id: cough
  label: Cough
  kind: symptom
  type: binary
  given:
    lung_cancer:
      p: 0.648
      source: ADES2014
      grade: B
      note: >-
        Symptom recorded in GP records at any time in the 2 years before diagnosis (CAPER, Exeter
        1998-2002, 247 cases; stage IV includes missing stage). Controls 29.5%. Referred-to-hospital
        cohort (WALTER2015): 56.2%. HAMILTON2005 reports 65% in the same data. Read through a
        summarising tool; re-check against the page.
    pneumonia:
      p: 0.833
      source: METLAY_UW
      grade: C
      note: >-
        Derived by us from the likelihood ratios of METLAY_UW (midpoints of the ranges; sensitivity =
        1 - LR- x specificity, specificity solved from LR+); secondary teaching page, so grade C. LR+
        1.8, LR- 0.31. Read through a summarising tool; re-check against the page.
    copd_exacerbation:
      p: 0.95
      source: assumption
      grade: assumption
      note: >-
        Cough, breathlessness and sputum are the defining symptoms of an exacerbation (NICE_NG114,
        qualitative only); the frequency is not sourced.
    asthma:
      p: 0.8
      source: assumption
      grade: assumption
      note: >-
        Research note section 9 suggestion; clinical knowledge, to be replaced by GINA or Kaypa hoito.
    tuberculosis:
      p: 0.8
      source: assumption
      grade: assumption
      note: "Research note section 9 suggestion; WHO or ECDC frequencies not opened."
    reflux_postinfectious_cough:
      p: 0.95
      source: assumption
      grade: assumption
      note: "Cough is the defining complaint of this condition; not sourced."
    viral_self_limiting:
      p: 0.9
      source: assumption
      grade: assumption
      note: "Research note section 9 suggestion; GRACE symptom tables not extracted."
    worried_well: {p: 0.3, source: assumption, grade: assumption, note: "D47: each symptom drawn independently with a moderate rate, so the set is incoherent; alarm symptoms (haemoptysis, weight loss) are rare. Not sourced."}
    default:
      p: 0.295
      source: ADES2014
      grade: C
      note: >-
        Population rate in age and sex matched adults in GP records over 2 years (CAPER controls,
        ADES2014), not a rate among chest-symptom presenters; used as a floor for conditions with no
        number of their own. Grade lowered one step (B to C) for the different population. Read
        through a summarising tool; re-check against the page.

