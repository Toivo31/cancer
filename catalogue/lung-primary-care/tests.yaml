- id: crp_poc
  label: "C-reactive protein, point of care (finger-prick, in the visit)"
  category: bloodwork
  outputs:
    - {id: crp, type: continuous, measures: crp_true, unit: "mg/L"}
  positive_when: "crp >= 50"
  timing:
    service_days: {value: 0.005, source: assumption, grade: assumption, note: "A finger-prick taken by the nurse or GP during the visit (minutes)."}
    report_days: {dist: fixed, value: 0.005, source: KELA_LAB, grade: C, note: "Kela lists CRP among point-of-care tests (examples: blood glucose, haemoglobin, CRP), used in the visit; HUS_DIAG2023 also lists CRP as a point-of-care test. The result time of minutes is our reading, not a quoted figure. re-check against the page."}
  resource_kind: poc_device
  cost_eur: {value: 3, source: KELA_VVK2026, grade: C, note: "Point-of-care tests use the code of the equivalent laboratory test (KELA_LAB), whose patient price is 3 EUR (KELA_VVK2026); the device and test strip cost to a health centre was not found. re-check against the page."}
  invasive: false
  note: >-
    Which CRP the encounter uses: this one is what a health-centre GP or nurse orders in the visit (care.yaml
    action order_crp); the laboratory test `crp` (hours to a day, action order_crp_lab) is the alternative when a
    venous sample is sent. Both measure the same hidden crp_true. Analytical error is not modelled.
