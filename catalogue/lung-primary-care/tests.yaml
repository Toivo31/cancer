    Copenhagen, PATHOLOGIST2024; 45% actionable alterations in advanced NSCLC, Tampere,
    HORMALAINEN2025) are not modelled: the pathway does not use marker status.


# ======================================================================================================
# Group test (D50): says "at least one of several conditions is present" (or, when negative, "probably none")
# without naming which. Cheap, fast, plentiful. NT-proBNP reads cardiac_strain (heart failure, some COPD, pneumonia).
# The other group tests already exist: chest_xray.abnormal and chest_ct.lesion_seen read lung_lesion (lung cancer,
# benign nodule, tuberculosis); crp reads crp_true (pneumonia, TB, COPD exacerbation high, others low);
# spirometry reads airflow_obstruction (COPD, asthma, also lung cancer).
- id: nt_probnp
  label: "NT-proBNP (natriuretic peptide)"
  category: bloodwork
  outputs:
    - id: bnp_high
      type: binary
      measures: cardiac_strain
      sensitivity: {value: 0.95, source: assumption, grade: assumption, note: "Rule-out test: high sensitivity is the point of using it for suspected heart failure (D50). Not sourced; no figure was opened."}
      specificity: {value: 0.65, source: assumption, grade: assumption, note: "Lower specificity: raised with age and kidney disease. Not sourced."}
  positive_when: bnp_high
  timing:
    service_days: {value: 0.01, source: assumption, grade: assumption, note: "blood draw at a sampling point; minutes to an hour of staff time, not sourced."}
    report_days: {dist: lognormal, median: 0.5, p90: 1.5, source: assumption, grade: assumption, note: "Same-day or next-day blood test; not sourced."}
  resource_kind: lab
  cost_eur: {value: 12, source: KELA_VVK2026, grade: C, note: "Kela pilot patient price list: P-proBNP 12 EUR (patient price; summarising tool). re-check against the page."}
  invasive: false
  note: "Group test (D50): a negative result makes heart failure unlikely; a positive does not name the cause."

# ======================================================================================================
# Definitive tests (D46): exactly one per condition, each measuring that condition's own marker dx_<condition>.
# They are slow, scarce and (mostly) expensive; prices from Finnish county lists (SOITE2024, EPHVA2026) or marked assumption.
# healthy conditions (no_disease_found, worried_well) have none: absence of disease is a diagnosis of exclusion.
- id: dx_lung_cancer_histology
  label: "Tissue sampling with histology report (definitive for lung cancer)"
  category: tissue
  outputs:
    - {id: lung_cancer_confirmed, type: binary, measures: dx_lung_cancer, sensitivity: {value: 0.88, source: RIVERA2013, grade: B, note: "Pooled sensitivity of flexible bronchoscopy for central lesions (ACCP 2013 abstract); peripheral lesions are lower (0.34 to 0.63) and CT-guided sampling about 0.90, so this is a mixed-route average and optimistic for small peripheral tumours."}, specificity: {value: 1.0, source: assumption, grade: assumption, note: "A malignant histology is not reported for non-cancer (RIVERA2013 and UZUN2017 give 1.0 for sampling)."}}
  positive_when: lung_cancer_confirmed
  timing:
    service_days: {value: 0.06, source: assumption, grade: assumption, note: "A procedure slot, not a visit."}
    report_days: {dist: lognormal, median: 7, p90: 14, source: STOKSTAD2019, grade: C, note: "Median 4.5 days from sampling to pathology report (Norway) plus immunohistochemistry and marker work-up; 7 and 14 are our estimates. Booking waits are on the resource."}
  resource_kind: ttnb_slot
  cost_eur: {value: 802, source: SOITE2024, grade: C, low: 616, high: 934, note: "Derived: CT-guided lung tissue sample 490 + core-biopsy report 192 + immunohistochemistry 120 (Soite 2024). Molecular pathology 693 is not included. re-check against the page."}
  invasive: true
  harm: {pneumothorax: {value: 0.01, source: assumption, grade: assumption, note: "As ct_guided_biopsy (assumption; HUO2020 gives larger rates for CT-guided lung biopsy)."}}
  requires: [chest_ct]
  note: "D46 definitive test for lung_cancer. Reaching it needs a referral and a booked procedure; primary care does not order it directly in Finnish practice."

- id: dx_pneumonia_chest_xray
  label: "Chest X-ray with radiologist report, read with the clinical picture (definitive for pneumonia)"
  category: imaging
  outputs:
    - {id: pneumonia_confirmed, type: binary, measures: dx_pneumonia, sensitivity: {value: 0.85, source: assumption, grade: assumption, note: "GRACE (VANVUGT2012) defined pneumonia by the radiograph, so it is the reference; some clinical pneumonia has no radiographic change. Not sourced."}, specificity: {value: 0.95, source: assumption, grade: assumption, note: "Not sourced."}}
  positive_when: pneumonia_confirmed
  timing:
    service_days: {value: 0.04, source: assumption, grade: assumption, note: "As chest_xray."}
    report_days: {dist: lognormal, median: 1.5, p90: 4, source: assumption, grade: assumption, note: "As chest_xray (scenario value)."}
  resource_kind: xray
  cost_eur: {value: 40, source: SOITE2024, grade: C, high: 45, note: "Soite 2024: Thorax PA 40 EUR. The cheapest and fastest definitive test: for pneumonia the definitive test is an ordinary film. re-check against the page."}
  invasive: false
  note: "D46 definitive test for pneumonia (WP-C8-3 package choice). Not slow or scarce in real practice; the world's cost_scale and the xray resource still apply."

- id: spirometry_reversibility
  label: "Spirometry with bronchodilator reversibility (definitive for COPD and asthma)"
  category: function
  outputs:
    - {id: copd_confirmed, type: binary, measures: dx_copd_exacerbation, sensitivity: {value: 0.9, source: assumption, grade: assumption, note: "Post-bronchodilator FEV1/FVC below 0.70 is the criterion (Kaypa hoito COPD page (kaypahoito.fi/nix02759) says the fixed 0.7 threshold is sensitive for clinician-confirmed COPD but over-diagnoses in the elderly and under-diagnoses under 45); a figure was not sourced."}, specificity: {value: 0.9, source: assumption, grade: assumption, note: "Fixed-ratio over-diagnosis in older people lowers specificity; not sourced."}}
