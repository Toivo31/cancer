- id: histology_report
  label: "Histology report (cell type)"
  category: tissue
  outputs:
    - {id: histology, type: categorical, measures: histology_group, accuracy: {value: 0.95, source: assumption, grade: assumption, note: "Subtyping on a small biopsy is occasionally wrong or reported as not otherwise specified; no figure sourced."}}
  positive_when: "histology is not None"
  timing:
    report_days:
      dist: lognormal
      median: 4.5
      p90: 9
      source: STOKSTAD2019
      grade: B
      note: >-
        Median 4.5 days from tissue sampling to pathology report, range 0-14 (Norway, stage I-II,
        carried); p90 9 is the scenario's.
  resource_kind: pathology
  invasive: false
  note: >-
    Reads a sample obtained by bronchoscopy, EBUS or needle biopsy; whether the sample caught the
    cancer is the sampling test's sensitivity. The histology is null when the tissue is not malignant,
    so positive_when means a cancer was typed. Molecular panels (turnaround 4 working days in-house in
    Copenhagen, PATHOLOGIST2024; 45% actionable alterations in advanced NSCLC, Tampere,
    HORMALAINEN2025) are not modelled: the pathway does not use marker status.
