  positive_when: nodes_malignant
  timing:
    service_days: {value: 0.06, source: assumption, grade: assumption, note: "As bronchoscopy (assumption)."}
    report_days:
      dist: lognormal
      median: 4
      p90: 7
      source: assumption
      grade: assumption
      note: "As bronchoscopy (assumption); no EBUS-specific time sourced."
  resource_kind: bronchoscopy
  cost_eur: {value: 1050, source: assumption, grade: assumption, note: "No EBUS price found: bronchoscopy with pathology (858 derived, SOITE2024) plus about 200 EUR for the ultrasound scope and nodal cytology (Soite S5 lymph node needle sample 229)."}
  invasive: true
  harm:
    infectious_complication:
      value: 0.0019
      source: AHMETOGLU2023
      grade: C
      note: >-
        Japanese nationwide survey 0.19% of 7,345 cases; literature range 0.16 to 0.54% (secondary:
        read in the introduction of a case report). Prospective Spanish multicentre cohort (SERRA2023,
        370 patients): 4.05% overall, 5.71% with risk factors, 0.8% without; used as the high bound
        (active follow-up, definition not checked). Read through a summarising tool; re-check against
        the page.
      low: 0.0016
      high: 0.0405
  requires: [chest_ct]

- id: ct_guided_biopsy
  label: "CT-guided needle biopsy"
  category: tissue
  outputs:
    - {id: malignant_cells, type: binary, measures: lesion_malignant, sensitivity: {value: 0.9, source: RIVERA2013, grade: A, note: "Pooled sensitivity of transthoracic needle aspiration or biopsy, with a trend to lower sensitivity for lesions under 2 cm (params/test_accuracy.yaml). Single-centre UZUN2017 reports 0.973 (optimistic), kept as the high bound.", high: 0.973}, specificity: {value: 1.0, source: UZUN2017, grade: B, note: "442 CT-guided fine-needle aspirations in Ankara 2011-2015: sensitivity 0.973, specificity 1.0, accuracy 97.6%."}}
  nondiagnostic:
    value: 0.027
    source: UZUN2017
    grade: B
    note: >-
      Single-centre CT-guided fine-needle aspiration, 12 of 432 (accuracy 97.6%); optimistic for a
      general hospital, sensitivity analysis up to 0.10 (params/test_accuracy.yaml). The scenario used
      0.08 for peripheral and 0.35 for central lesions (both assumptions): the sourced 0.027 replaces
      0.08, and 0.35 for central (hard to reach) lesions is carried.
    high: 0.1
    by:
      lesion_location:
        central:
          value: 0.35
          source: assumption
          grade: assumption
          note: "Scenario assumption: central lesions are hard to reach with a needle."
  positive_when: malignant_cells
  timing:
    service_days: {value: 0.06, source: assumption, grade: assumption, note: "Scenario value (assumption)."}
    report_days:
      dist: lognormal
      median: 4.5
      p90: 9
      source: STOKSTAD2019
      grade: B
      note: >-
        Median 4.5 days from tissue sampling to pathology report, range 0-14 (Norway, stage I-II); p90
        9 is the scenario's. As in the scenario this includes the pathology reading.
  resource_kind: ttnb_slot
  cost_eur: {value: 682, source: SOITE2024, grade: C, low: 490, high: 814, note: "Derived: Soite 2024 CT-guided lung tissue sample 490 EUR plus a core-biopsy pathology report 192 EUR (the report time includes pathology). re-check against the page."}
  invasive: true
  harm:
    pneumothorax:
      value: 0.15
      source: WIENER2011
      grade: B
      note: >-
        About 15% in a US population-based sample of biopsies of nodules (secondary summary).
        Pooled-versus-carried: the meta-analysis HUO2020 (36 studies, 23,104 patients, CT-guided lung
        biopsy) gives 0.259 (spread across studies 0.043 to 0.524); kept as the high bound.
        Single-centre UZUN2017: 0.19.
      high: 0.259
    chest_tube:
      value: 0.066
      source: WIENER2011
      grade: B
      note: >-
        Needing a chest tube (secondary summary). HUO2020 pooled chest drain insertion 0.069 (0 to
        0.15), kept as the high bound. UZUN2017: 0.029.
      high: 0.069
  requires: [chest_ct]
  note: >-
    Risk factors for pneumothorax in HUO2020 (bulla odds ratio 6.13, emphysema 3.33) are not modelled.

