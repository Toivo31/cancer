# Pull requests: Python tests, web (type check, tests, build) and the container. No deploy from CI (spec 07).
name: ci
on:
  pull_request:
  push:
    branches: [main, overnight/sim]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            service/requirements.txt
      - run: pip install -r requirements.txt -r service/requirements.txt pytest
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Is there a web app yet?
        id: web
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, type check, test, build
        if: steps.web.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build (the full image when web/ exists, the API target otherwise)
        run: |
          if [ -f web/package.json ]; then docker build -t pathway-platform .; else docker build --target api -t pathway-platform .; fi
      - name: Refuses to start without a token
        run: |
          if docker run --rm pathway-platform python -c "import service.app" 2>/tmp/err; then echo "started without a token"; exit 1; fi
          grep -q PATHWAY_ACCESS_TOKEN /tmp/err
      - name: Starts, answers, keeps strangers out
        run: |
          docker run -d --name pw -p 8000:8000 -v pw-data:/data -e PATHWAY_ACCESS_TOKEN=ci-token-0123456789abcdef pathway-platform
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          [ -f web/package.json ] || export SMOKE_NO_WEB=1
          bash deploy/smoke.sh http://127.0.0.1:8000 ci-token-0123456789abcdef || { docker logs pw; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/projects)" = 401 ]
