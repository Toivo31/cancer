[pytest]
pythonpath = . tests
testpaths = tests
# tests/security was written against the tree before access control landed and must be run file by file
# (python -m pytest tests/security/test_x.py); it is triaged in docs/plan/04-status.md (C6 F7).
addopts = --ignore=tests/security
markers =
    slow: listed in tests/slow_tests.txt (over about 2 s); left out of the fast tier, run by scripts/gate.sh --slow
